<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a623">
<title>VCA Oefenexamen — Wisselstroom & Driefasen</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --oranje: #f5a623;
    --oranje-dark: #d98a0b;
    --donker: #1a1a1a;
    --groen: #2e9e4f;
    --rood: #d64545;
    --grijs: #f2f2f2;
    --rand: #e0e0e0;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #e9ecef;
    color: var(--donker);
    -webkit-text-size-adjust: 100%;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
  }
  /* ---------- Topbar ---------- */
  .topbar {
    background: var(--donker);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .brand {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
  }
  .topbar .brand span { color: var(--oranje); }
  .topbar .timer {
    font-size: 14px;
    background: rgba(255,255,255,0.12);
    padding: 5px 10px;
    border-radius: 20px;
    font-variant-numeric: tabular-nums;
  }
  .progresswrap { height: 6px; background: var(--grijs); }
  .progressbar { height: 100%; width: 0%; background: var(--oranje); transition: width .3s; }

  /* ---------- Content ---------- */
  .content { flex: 1; padding: 22px 18px 30px; }

  /* ---------- Start screen ---------- */
  .hero { text-align: center; padding: 24px 6px; }
  .hero .badge {
    display: inline-block;
    background: var(--oranje);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .hero h1 { font-size: 24px; margin: 0 0 8px; line-height: 1.25; }
  .hero p { color: #555; font-size: 14px; line-height: 1.5; margin: 0 auto 8px; max-width: 380px; }
  .infogrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 22px 0;
  }
  .infocard {
    background: var(--grijs);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .infocard .big { font-size: 22px; font-weight: 800; color: var(--oranje-dark); }
  .infocard .lbl { font-size: 12px; color: #666; margin-top: 2px; }
  .topiclist { text-align: left; margin: 18px auto; max-width: 380px; }
  .topiclist li { margin: 6px 0; font-size: 14px; color: #444; }

  /* ---------- Question ---------- */
  .qmeta { font-size: 13px; color: #888; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .qmeta .cat { color: var(--oranje-dark); font-weight: 700; }
  .qtext { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 0 0 6px; }
  .qsub { font-size: 13px; color: #777; margin: 0 0 16px; }
  .formula {
    display: inline-block;
    background: var(--grijs);
    border: 1px solid var(--rand);
    border-radius: 8px;
    padding: 6px 12px;
    font-style: italic;
    margin: 4px 0 14px;
    font-size: 15px;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 2px solid var(--rand);
    border-radius: 14px;
    padding: 15px 16px;
    font-size: 16px;
    cursor: pointer;
    background: #fff;
    transition: all .15s;
    user-select: none;
  }
  .option:active { transform: scale(0.99); }
  .option .letter {
    flex: 0 0 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--grijs);
    color: #444;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .option.selected { border-color: var(--oranje); background: #fff7ec; }
  .option.selected .letter { background: var(--oranje); color: #fff; }
  .option.correct { border-color: var(--groen); background: #eafaef; }
  .option.correct .letter { background: var(--groen); color: #fff; }
  .option.wrong { border-color: var(--rood); background: #fdeaea; }
  .option.wrong .letter { background: var(--rood); color: #fff; }
  .option.disabled { cursor: default; }

  .explain {
    margin-top: 16px;
    background: #fff7ec;
    border-left: 4px solid var(--oranje);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }
  .explain.show { display: block; }
  .explain b { color: var(--oranje-dark); }

  /* ---------- Footer buttons ---------- */
  .footer {
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--rand);
    display: flex;
    gap: 10px;
    background: #fff;
    position: sticky;
    bottom: 0;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--oranje); color: #fff; }
  .btn-primary:disabled { background: #f0d9af; cursor: not-allowed; }
  .btn-ghost { background: var(--grijs); color: #444; flex: 0 0 auto; padding: 16px 22px; }
  .btn-dark { background: var(--donker); color: #fff; }
  .btn-full { width: 100%; flex: none; }

  /* ---------- Result ---------- */
  .result { text-align: center; padding: 10px 4px; }
  .scorering {
    width: 150px; height: 150px;
    border-radius: 50%;
    margin: 10px auto 18px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff;
  }
  .scorering .pct { font-size: 38px; font-weight: 800; line-height: 1; }
  .scorering .sub { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  .verdict { font-size: 20px; font-weight: 800; margin: 4px 0; }
  .verdict.pass { color: var(--groen); }
  .verdict.fail { color: var(--rood); }
  .reviewlist { text-align: left; margin-top: 20px; }
  .reviewitem {
    border: 1px solid var(--rand);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .reviewitem .rq { font-weight: 600; margin-bottom: 6px; }
  .reviewitem .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .tag.ok { background: #eafaef; color: var(--groen); }
  .tag.no { background: #fdeaea; color: var(--rood); }
  .reviewitem .ra { margin-top: 6px; color: #555; }
  .reviewitem .ra b { color: var(--groen); }
  .hidden { display: none !important; }
  .flagnote { font-size: 12px; color: #999; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">VCA<span>·</span>OEFEN</div>
    <div class="timer" id="timer">00:00</div>
  </div>
  <div class="progresswrap"><div class="progressbar" id="progressbar"></div></div>

  <div class="content" id="content"></div>

  <div class="footer" id="footer"></div>
</div>

<script>
/* ============================================================
   VRAGEN — gebaseerd op lesaantekeningen wisselstroom & driefasen
   answer = index van juiste optie (0-based)
   ============================================================ */
const QUESTIONS = [
  {
    cat: "Frequentie",
    q: "Een sinusvormige spanning heeft een frequentie van 50 Hz. Wat is de periode T?",
    formula: "T = 1 / f",
    options: ["0,02 s (20 ms)", "0,05 s (50 ms)", "2 s"],
    answer: 0,
    explain: "T = 1/f = 1/50 = 0,02 s = 20 ms."
  },
  {
    cat: "Frequentie",
    q: "Wat betekent de frequentie van een periodiek signaal?",
    options: [
      "Het aantal periodes per seconde",
      "De hoogste spanning die voorkomt",
      "De tijd die één periode duurt"
    ],
    answer: 0,
    explain: "Frequentie = aantal periodes per seconde, eenheid hertz (Hz). De duur van één periode is de periode T."
  },
  {
    cat: "Topwaarde",
    q: "De topwaarde van een spanning is Um = 325 V. Hoe groot is de piek-piekwaarde Utt?",
    options: ["650 V", "230 V", "162,5 V"],
    answer: 0,
    explain: "Utt = 2 × Um = 2 × 325 = 650 V."
  },
  {
    cat: "Effectieve waarde",
    q: "Een spanning heeft topwaarde Um = 325 V. Wat is de effectieve waarde Ueff?",
    formula: "Ueff = Um / √2",
    options: ["≈ 230 V", "≈ 460 V", "≈ 325 V"],
    answer: 0,
    explain: "Ueff = Um/√2 = 325/1,414 ≈ 230 V. Dit is de gewone netspanning."
  },
  {
    cat: "Effectieve waarde",
    q: "Een wisselspanning heeft Ueff = 230 V. Hoe groot is de topwaarde Um?",
    formula: "Um = Ueff × √2",
    options: ["≈ 325 V", "≈ 163 V", "≈ 460 V"],
    answer: 0,
    explain: "Um = Ueff × √2 = 230 × 1,414 ≈ 325 V."
  },
  {
    cat: "Ideale weerstand",
    q: "Bij een ideale weerstand: wat is het faseverschil tussen spanning en stroom?",
    options: ["0° — U en I zijn in fase", "90° — stroom loopt na", "90° — stroom loopt voor"],
    answer: 0,
    explain: "Een ideale weerstand heeft geen L en geen C, daarom zijn spanning en stroom in fase (φ = 0°)."
  },
  {
    cat: "Ideale weerstand",
    q: "Een ideale weerstand R = 100 Ω staat op Ueff = 230 V. Hoe groot is Ieff?",
    formula: "I = U / R",
    options: ["2,3 A", "23 A", "0,43 A"],
    answer: 0,
    explain: "Ieff = U/R = 230/100 = 2,3 A."
  },
  {
    cat: "Ideale spoel",
    q: "Bij een ideale spoel: hoe gedraagt de stroom zich ten opzichte van de spanning?",
    options: [
      "De stroom loopt 90° NA op de spanning",
      "De stroom loopt 90° VOOR op de spanning",
      "Stroom en spanning zijn in fase"
    ],
    answer: 0,
    explain: "Bij een ideale spoel naijlt (loopt na) de stroom 90° op de spanning. Ezelsbruggetje: bij een spoeL Loopt de stroom achter."
  },
  {
    cat: "Ideale spoel",
    q: "Een ideale spoel L = 0,2 H zit op f = 50 Hz. Wat is de reactantie XL?",
    formula: "XL = ω·L = 2·π·f·L",
    options: ["≈ 62,8 Ω", "≈ 31,4 Ω", "≈ 6,28 Ω"],
    answer: 0,
    explain: "XL = 2·π·f·L = 2·π·50·0,2 ≈ 62,8 Ω."
  },
  {
    cat: "Ideale condensator",
    q: "Bij een ideale condensator: hoe gedraagt de stroom zich ten opzichte van de spanning?",
    options: [
      "De stroom loopt 90° VOOR op de spanning",
      "De stroom loopt 90° NA op de spanning",
      "Stroom en spanning zijn in fase"
    ],
    answer: 0,
    explain: "Bij een ideale condensator ijlt de stroom 90° VOOR op de spanning (vooruit)."
  },
  {
    cat: "Ideale condensator",
    q: "Een ideale condensator C = 50 µF zit op f = 50 Hz. Wat is de reactantie XC?",
    formula: "XC = 1 / (ω·C) = 1 / (2·π·f·C)",
    options: ["≈ 63,7 Ω", "≈ 6,37 Ω", "≈ 637 Ω"],
    answer: 0,
    explain: "XC = 1/(2·π·50·50·10⁻⁶) ≈ 63,7 Ω."
  },
  {
    cat: "RL-kring",
    q: "In een serie RL-kring is UR = 80 V en UL = 60 V. Hoe groot is de totale spanning U?",
    formula: "U² = UR² + UL²",
    options: ["100 V", "140 V", "70 V"],
    answer: 0,
    explain: "U = √(80² + 60²) = √(6400+3600) = √10000 = 100 V (stelling van Pythagoras)."
  },
  {
    cat: "RL-kring",
    q: "Gegeven U = 230 V en UR = 150 V in een RL-kring. Hoe groot is UL?",
    formula: "UL = √(U² − UR²)",
    options: ["≈ 174 V", "≈ 80 V", "≈ 380 V"],
    answer: 0,
    explain: "UL = √(230² − 150²) = √(52900 − 22500) = √30400 ≈ 174,4 V."
  },
  {
    cat: "Driefasen — ster",
    q: "Een sterschakeling heeft fasespanning Uf = 230 V. Wat is de lijnspanning UL?",
    formula: "UL = √3 × Uf",
    options: ["≈ 400 V", "≈ 230 V", "≈ 133 V"],
    answer: 0,
    explain: "UL = √3 × Uf = 1,732 × 230 ≈ 398 V ≈ 400 V. Daarom: 3×400V net = 230V per fase."
  },
  {
    cat: "Driefasen — ster",
    q: "Een driefasennet heeft lijnspanning UL = 400 V (sterschakeling). Wat is de fasespanning Uf?",
    formula: "Uf = UL / √3",
    options: ["≈ 230 V", "≈ 693 V", "≈ 400 V"],
    answer: 0,
    explain: "Uf = UL/√3 = 400/1,732 ≈ 230,9 V."
  },
  {
    cat: "Driefasen — ster",
    q: "Welke verhouding geldt voor de STROOM in een sterschakeling?",
    options: [
      "IL = If  (lijnstroom = fasestroom)",
      "IL = √3 × If",
      "IL = If / √3"
    ],
    answer: 0,
    explain: "In ster: IL = If. Voor de spanning geldt daar UL = √3 × Uf."
  },
  {
    cat: "Driefasen — driehoek",
    q: "Welke verhoudingen gelden voor een DRIEHOEKschakeling?",
    options: [
      "UL = Uf  en  IL = √3 × If",
      "UL = √3 × Uf  en  IL = If",
      "UL = Uf  en  IL = If"
    ],
    answer: 0,
    explain: "In driehoek is de lijnspanning gelijk aan de fasespanning (UL = Uf) en de lijnstroom IL = √3 × If. Dit is precies omgekeerd aan ster."
  },
  {
    cat: "Driefasen — ster",
    q: "Een driefasenmotor in ster heeft fasestroom If = 10 A. Hoe groot is de lijnstroom IL?",
    options: ["10 A", "17,3 A", "5,8 A"],
    answer: 0,
    explain: "In sterschakeling is IL = If = 10 A."
  },
  {
    cat: "Herkennen",
    q: "Hoe herken je een STERschakeling aan het schema?",
    options: [
      "De drie wikkelingen komen samen in een gemeenschappelijk nulpunt (N)",
      "De drie wikkelingen vormen een gesloten driehoek zonder nulpunt",
      "Er zijn maar twee wikkelingen aangesloten"
    ],
    answer: 0,
    explain: "Ster = sterpunt/nulpunt (N) waar de drie fasen samenkomen. Driehoek = wikkelingen in een gesloten lus, geen nulpunt."
  },
  {
    cat: "Examenvraag",
    q: "Een symmetrische sterbelasting op 3×400V+N heeft R = 40 Ω per fase. Hoe groot is de fasestroom If?",
    formula: "Uf = 400/√3 ≈ 231 V ;  If = Uf / R",
    options: ["≈ 5,8 A", "≈ 10 A", "≈ 17,3 A"],
    answer: 0,
    explain: "Uf = 400/√3 ≈ 231 V, dus If = 231/40 ≈ 5,77 A. In ster is IL ook ≈ 5,77 A."
  }
];

/* ============================================================
   LOGICA
   ============================================================ */
let state = {
  idx: 0,
  answers: new Array(QUESTIONS.length).fill(null),
  started: false,
  startTime: null,
  timerInt: null,
  finished: false
};

const content = document.getElementById('content');
const footer = document.getElementById('footer');
const progressbar = document.getElementById('progressbar');
const timerEl = document.getElementById('timer');

function fmtTime(s) {
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const ss = (s%60).toString().padStart(2,'0');
  return m + ':' + ss;
}
function startTimer() {
  state.startTime = Date.now();
  state.timerInt = setInterval(() => {
    const el = Math.floor((Date.now()-state.startTime)/1000);
    timerEl.textContent = fmtTime(el);
  }, 1000);
}
function stopTimer() { clearInterval(state.timerInt); }
function elapsed() { return Math.floor((Date.now()-state.startTime)/1000); }

/* ---------- Start screen ---------- */
function renderStart() {
  progressbar.style.width = '0%';
  timerEl.textContent = '00:00';
  content.innerHTML = `
    <div class="hero">
      <div class="badge">OEFENEXAMEN</div>
      <h1>Wisselstroom &amp;<br>Driefasensystemen</h1>
      <p>Test jezelf met ${QUESTIONS.length} meerkeuzevragen. Kies per vraag het juiste antwoord en bekijk meteen de uitleg.</p>
      <div class="infogrid">
        <div class="infocard"><div class="big">${QUESTIONS.length}</div><div class="lbl">vragen</div></div>
        <div class="infocard"><div class="big">60%</div><div class="lbl">geslaagd vanaf</div></div>
      </div>
      <ul class="topiclist">
        <li>✓ Frequentie, periode, top- en effectieve waarde</li>
        <li>✓ Ideale weerstand, spoel en condensator</li>
        <li>✓ Faseverschillen &amp; reactantie (XL, XC)</li>
        <li>✓ RL-kring &amp; vectordiagram (Pythagoras)</li>
        <li>✓ Ster- en driehoekschakeling (UL, Uf, IL, If)</li>
      </ul>
    </div>`;
  footer.innerHTML = `<button class="btn btn-primary btn-full" onclick="beginExam()">Start examen ▸</button>`;
}

function beginExam() {
  state.idx = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.finished = false;
  state.started = true;
  startTimer();
  renderQuestion();
}

/* ---------- Question screen ---------- */
function renderQuestion() {
  const i = state.idx;
  const Q = QUESTIONS[i];
  const chosen = state.answers[i];
  const answered = chosen !== null;
  progressbar.style.width = ((i)/QUESTIONS.length*100) + '%';

  let opts = Q.options.map((opt, k) => {
    let cls = 'option';
    if (answered) {
      cls += ' disabled';
      if (k === Q.answer) cls += ' correct';
      else if (k === chosen) cls += ' wrong';
    }
    const letter = String.fromCharCode(65+k);
    return `<div class="${cls}" onclick="choose(${k})">
              <div class="letter">${letter}</div>
              <div class="otext">${opt}</div>
            </div>`;
  }).join('');

  content.innerHTML = `
    <div class="qmeta">
      <span class="cat">${Q.cat}</span>
      <span>Vraag ${i+1} / ${QUESTIONS.length}</span>
    </div>
    <p class="qtext">${Q.q}</p>
    ${Q.formula ? `<div class="formula">${Q.formula}</div>` : ''}
    <div class="options">${opts}</div>
    <div class="explain ${answered ? 'show':''}" id="explain">
      <b>${chosen===Q.answer ? '✓ Juist!' : (answered ? '✗ Fout.' : '')}</b>
      ${Q.explain}
    </div>`;

  renderFooterQuestion();
}

function renderFooterQuestion() {
  const i = state.idx;
  const answered = state.answers[i] !== null;
  const isLast = i === QUESTIONS.length - 1;
  let html = '';
  if (i > 0) html += `<button class="btn btn-ghost" onclick="prev()">◂</button>`;
  if (isLast) {
    html += `<button class="btn btn-dark" id="nextbtn" onclick="finish()" ${answered?'':'disabled'}>Resultaat ▸</button>`;
  } else {
    html += `<button class="btn btn-primary" id="nextbtn" onclick="next()" ${answered?'':'disabled'}>Volgende ▸</button>`;
  }
  footer.innerHTML = html;
}

function choose(k) {
  const i = state.idx;
  if (state.answers[i] !== null) return; // al beantwoord, niet meer wijzigen
  state.answers[i] = k;
  renderQuestion();
}
function next() { if (state.idx < QUESTIONS.length-1) { state.idx++; renderQuestion(); } }
function prev() { if (state.idx > 0) { state.idx--; renderQuestion(); } }

/* ---------- Result screen ---------- */
function finish() {
  stopTimer();
  state.finished = true;
  progressbar.style.width = '100%';
  const total = QUESTIONS.length;
  const correct = state.answers.reduce((acc, a, i) => acc + (a === QUESTIONS[i].answer ? 1 : 0), 0);
  const pct = Math.round(correct/total*100);
  const pass = pct >= 60;
  const ringColor = pass ? 'var(--groen)' : 'var(--rood)';
  const time = fmtTime(elapsed());

  let reviews = QUESTIONS.map((Q, i) => {
    const a = state.answers[i];
    const ok = a === Q.answer;
    const your = a===null ? '—' : `${String.fromCharCode(65+a)}) ${Q.options[a]}`;
    return `<div class="reviewitem">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span class="tag ${ok?'ok':'no'}">${ok?'JUIST':'FOUT'}</span>
        <span style="font-size:12px;color:#aaa">Vraag ${i+1} · ${Q.cat}</span>
      </div>
      <div class="rq" style="margin-top:8px">${Q.q}</div>
      ${ok ? '' : `<div class="ra">Jouw antwoord: ${your}</div>`}
      <div class="ra">Juist: <b>${String.fromCharCode(65+Q.answer)}) ${Q.options[Q.answer]}</b></div>
      <div class="ra" style="color:#777;margin-top:4px">${Q.explain}</div>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="result">
      <div class="scorering" style="background:${ringColor}">
        <div class="pct">${pct}%</div>
        <div class="sub">${correct} / ${total} goed</div>
      </div>
      <div class="verdict ${pass?'pass':'fail'}">${pass?'✓ Geslaagd!':'✗ Nog niet geslaagd'}</div>
      <p style="color:#666;font-size:14px;margin:4px 0">Tijd: ${time} · grens: 60%</p>
      <div class="reviewlist">
        <h3 style="font-size:15px;margin:18px 0 10px">Overzicht antwoorden</h3>
        ${reviews}
      </div>
    </div>`;
  footer.innerHTML = `
    <button class="btn btn-ghost" onclick="scrollTo({top:0,behavior:'smooth'})">▲</button>
    <button class="btn btn-primary" onclick="renderStart()">Opnieuw ▸</button>`;
}

/* ---------- init ---------- */
renderStart();
</script>
</body>
</html>
